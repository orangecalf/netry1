name: Build APK

on:
  push:
    branches:
      - claude/samsung-motion-photo-stripper-vKcNc
      - main
    paths:
      - 'motion-photo-stripper/**'
  workflow_dispatch:   # lets you trigger it manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x motion-photo-stripper/gradlew

      - name: Build debug APK
        working-directory: motion-photo-stripper
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionPhotoStripper-debug
          path: motion-photo-stripper/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
